buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://files.minecraftforge.net/maven"
        }
    }
    dependencies {
        classpath "net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT"
    }
}

apply plugin: "net.minecraftforge.gradle.forge"


[compileJava, compileTestJava, javadoc]*.options*.encoding = 'UTF-8'

def detectCurrentPlatform = {
    String osName = System.getProperty("os.name", "").toLowerCase(Locale.ROOT)
    String osArch = System.getProperty("os.arch", "").toLowerCase(Locale.ROOT)
    if (osName.contains("win")) {
        return "windows-x86_64"
    }
    if (osName.contains("mac") || osName.contains("darwin")) {
        return (osArch.contains("aarch64") || osArch.contains("arm")) ? "macosx-arm64" : "macosx-x86_64"
    }
    return "linux-x86_64"
}

ext {
    javacvVersion = "1.5.9"
    ffmpegVersion = "6.0-1.5.9"
    supportedPlatforms = [
            "windows-x86_64": "Windows x86_64",
            "linux-x86_64"  : "Linux x86_64",
            "macosx-x86_64" : "macOS x86_64",
            "macosx-arm64"  : "macOS arm64",
    ]
    currentPlatform = detectCurrentPlatform()
    targetPlatform = (findProperty("targetPlatform") ?: currentPlatform).toString()
}

if (!supportedPlatforms.containsKey(targetPlatform)) {
    throw new GradleException("Unsupported targetPlatform '${targetPlatform}'. Supported values: ${supportedPlatforms.keySet().join(', ')}")
}

group = 'EarthSkyDev'
version = '1.4.0-SNAPSHOT'
archivesBaseName = 'La Pluma'

minecraft {
    version = project.forgeVersion
    runDir = "run"

    // the mappings can be changed at any time, and must be in the following format.
    // snapshot_YYYYMMDD   snapshot are built nightly.
    // stable_#            stables are built at the discretion of the MCP team.
    // Use non-default mappings at your own risk. they may not always work.
    // simply re-run your setup task after changing the mappings to update your workspace.
    mappings = project.mcpVersion
    // makeObfSourceJar = false // an Srg named sources jar is made by default. uncomment this to disable.
}

repositories {
    mavenCentral()
}

configurations {
    shade
    compile.extendsFrom shade
}

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'

    testCompileOnly 'org.projectlombok:lombok:1.18.24'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.24'

    shade "org.bytedeco:javacv:${javacvVersion}"
    shade "org.bytedeco:ffmpeg:${ffmpegVersion}"
    shade "org.bytedeco:javacpp:${javacvVersion}"
    shade "org.bytedeco:ffmpeg:${ffmpegVersion}:${targetPlatform}"
    shade "org.bytedeco:javacpp:${javacvVersion}:${targetPlatform}"
}

jar{
    classifier = targetPlatform
    manifest{
        attributes 'FMLAT' : "lapluma_at.cfg"
        attributes 'ContainedDeps': "codecjlayermp3-1.0.0-SNAPSHOT.jar jlayer-1.0.1.jar"
        attributes 'LaPluma-TargetPlatform': targetPlatform
    }

    into('META-INF/libraries'){
        from 'libs/'
    }

    from {
        configurations.shade.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

task printTargetPlatform {
    group = "build"
    description = "Prints the platform baked into this jar."
    doLast {
        println "Building La Pluma for ${supportedPlatforms[targetPlatform]} (${targetPlatform})"
        println "Override with: ./gradlew clean build -PtargetPlatform=<${supportedPlatforms.keySet().join('|')}>"
    }
}

task printPlatformBuildCommands {
    group = "build"
    description = "Shows the commands for each platform-specific release jar."
    doLast {
        supportedPlatforms.each { platformId, platformName ->
            println "${platformName}: ./gradlew clean build -PtargetPlatform=${platformId}"
        }
    }
}



processResources {
    // this will ensure that this task is redone when the versions change.
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include "mcmod.info"

        // replace version and mcversion
        expand "version": project.version, "mcversion": project.minecraft.version
    }

    // copy everything else, thats not the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude "mcmod.info"
    }
}
